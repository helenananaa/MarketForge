services:
  postgres:
    image: postgres:16-alpine
    container_name: marketforge-postgres
    environment:
      POSTGRES_DB: marketforge
      POSTGRES_USER: marketforge
      POSTGRES_PASSWORD: marketforge
    ports:
      - "55432:5432"
    volumes:
      - marketforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketforge -d marketforge"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  marketforge-postgres-data:
