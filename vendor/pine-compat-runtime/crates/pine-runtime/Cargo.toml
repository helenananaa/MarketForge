[package]
name = "pine-runtime"
version = "0.3.1"
description.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "=0.4.44", default-features = false }
chrono-tz = "0.10"
pine-builtins = { path = "../pine-builtins" }
pine-ir = { path = "../pine-ir" }
regex = "=1.12.3"
regex-syntax = "=0.8.10"
serde = { version = "1", features = ["derive"] }
# MarketForge restores from its frozen broker transcript rather than this
# crate's JSON snapshots. Keep the host parser's existing feature set.
serde_json = "1"
unicode_names2 = "=2.0.0"

[dev-dependencies]
pine-sema = { path = "../pine-sema" }
pine-syntax = { path = "../pine-syntax" }

[lib]
name = "pine_runtime"
path = "src/lib.rs"
