[package]
name = "exchange-server"
default-run = "exchange-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
risk-benchmark = []
# Diagnostic counters for isolated load runs; absent from ordinary builds.
bench-execution-timing = ["exchange-core/bench-observation-timing"]
# Allocation attribution is confined to the ignored library diagnostics.
memory-diagnostics = []
# Opt-in experiment; the installed process adapter remains the default.
pine-in-process = ["dep:pine-runtime", "dep:pine-sema", "dep:pine-syntax", "dep:num-rational", "dep:num-bigint", "dep:num-traits"]

[[example]]
name = "benchmark_margin_progress"
required-features = ["risk-benchmark"]

[[example]]
name = "pine_inprocess_probe"
required-features = ["pine-in-process"]

[dependencies]
pine-runtime = { path = "../vendor/pine-compat-runtime/crates/pine-runtime", optional = true }
pine-sema = { path = "../vendor/pine-compat-runtime/crates/pine-sema", optional = true }
pine-syntax = { path = "../vendor/pine-compat-runtime/crates/pine-syntax", optional = true }
num-rational = { version = "0.4", features = ["num-bigint"], optional = true }
num-bigint = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
argon2 = "0.5.3"
bytes = "1"
getrandom = "0.3.4"
im = "15.1.0"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
exchange-core = { path = "../exchange-core" }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = "0.29"
