[package]
name = "marketforge-candlescope-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
exchange-core = { path = "../exchange-core" }
exchange-server = { path = "../exchange-server" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[lib]
name = "marketforge_candlescope_plugin"
path = "src/lib.rs"

[[bin]]
name = "marketforge-candlescope-plugin"
path = "src/main.rs"
