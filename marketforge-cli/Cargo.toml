[package]
name = "marketforge-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "marketforge"
path = "src/main.rs"

[dependencies]
exchange-core = { path = "../exchange-core" }
exchange-server = { path = "../exchange-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
