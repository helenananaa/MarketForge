[package]
name = "exchange-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Observation lock counters for isolated benchmark builds only.
bench-observation-timing = []

[dependencies]
im = { version = "15.1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
# Durable native indicator state must survive JSON bytes without float drift.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
